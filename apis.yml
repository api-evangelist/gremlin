aid: gremlin
name: Gremlin
description: Gremlin is a chaos engineering platform that helps teams build more resilient systems by running controlled failure
  experiments. It provides tools to simulate infrastructure failures, network issues, and resource exhaustion to identify
  and fix weaknesses before they cause real outages.
