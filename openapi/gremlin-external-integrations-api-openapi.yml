components:
  schemas:
    CreateTeamExternalIntegrationRequest:
      required:
      - lastAuthenticationStatus
      - name
      - privateNetwork
      type: object
      properties:
        url:
          type: string
          description: Uri of the configuration
          format: url
        headers:
          type: object
          additionalProperties:
            type: string
            description: Headers of configuration
          description: Headers of configuration
        headersArn:
          type: string
          description: Arn of remote header configuration
        name:
          type: string
          description: Name of configuration
        privateNetwork:
          type: boolean
          description: Is private network
        lastAuthenticationStatus:
          type: string
          description: Last authentication status
          enum:
          - AUTHENTICATED
          - UNAUTHENTICATED
          - UNTESTED
        integrationSpecificValues:
          type: object
          additionalProperties:
            type: string
            description: Map of values required for a specific integration, for example AWS credentials AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
          description: Map of values required for a specific integration, for example AWS credentials AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
        multiSelectTags:
          type: object
          additionalProperties:
            type: array
            description: The tags associated with this integration
            items:
              type: string
              description: The tags associated with this integration
          description: The tags associated with this integration
      description: Represents the configuration for an external integration
    ExternalIntegrationResponse:
      type: object
      properties:
        userId:
          type: string
        type:
          type: string
          enum:
          - JIRA
          - DATADOG
          - DATADOG_EU
          - DATADOG_US3
          - DATADOG_US5
          - DATADOG_US1_FED
          - PAGERDUTY
          - NEWRELIC
          - GRAFANA
          - DYNATRACE
          - APPDYNAMICS
          - PROMETHEUS
          - CUSTOM
          - K6
          - LOAD_GENERATOR_CUSTOM
          - AWS
          - AZURE
        accountId:
          type: string
        url:
          type: string
    TeamExternalIntegrationsResponse:
      type: object
      properties:
        integrations:
          type: array
          items:
            $ref: '#/components/schemas/TeamExternalIntegrationResponse'
    TeamExternalIntegrationResponse:
      type: object
      properties:
        identifier:
          type: string
        userId:
          type: string
        type:
          type: string
          enum:
          - JIRA
          - DATADOG
          - DATADOG_EU
          - DATADOG_US3
          - DATADOG_US5
          - DATADOG_US1_FED
          - PAGERDUTY
          - NEWRELIC
          - GRAFANA
          - DYNATRACE
          - APPDYNAMICS
          - PROMETHEUS
          - CUSTOM
          - K6
          - LOAD_GENERATOR_CUSTOM
          - AWS
          - AZURE
        observabilityToolType:
          type: string
          enum:
          - DATADOG
          - PAGERDUTY
          - NEWRELIC
          - GRAFANA
          - DYNATRACE
          - APPDYNAMICS
          - PROMETHEUS
          - CUSTOM
          - AWS
          - AZURE
        domain:
          type: string
        url:
          type: string
          format: url
        headers:
          type: object
          additionalProperties:
            type: string
        headersArn:
          type: string
        name:
          type: string
        teamId:
          type: string
        privateNetwork:
          type: boolean
        canBeUsedAsStatusCheck:
          type: boolean
        lastAuthenticationStatus:
          type: string
          enum:
          - AUTHENTICATED
          - UNAUTHENTICATED
          - UNTESTED
        integrationSpecificValues:
