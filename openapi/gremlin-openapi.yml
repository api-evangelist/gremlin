components:
  schemas:
    AttackConfiguration:
      required:
      - command
      - targets
      type: object
      properties:
        command:
          $ref: '#/components/schemas/ServiceCommand'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/ServiceTarget'
        sampling:
          $ref: '#/components/schemas/TargetSampling'
    ContainerSelection:
      type: object
      properties:
        selectionType:
          type: string
          enum:
          - EXACT
          - ALL
          - ANY
        containerNames:
          type: array
          items:
            type: string
    ContainerTarget:
      type: object
      allOf:
      - $ref: '#/components/schemas/TargetingStrategy'
      - type: object
        properties:
          ids:
            type: array
            items:
              type: string
          isAll:
            type: boolean
          multiSelectLabels:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
    EvenTargetSampling:
      required:
      - percent
      type: object
      allOf:
      - $ref: '#/components/schemas/TargetSampling'
      - type: object
        properties:
          percent:
            type: integer
            format: int32
    ExactTargetSampling:
      required:
      - count
      type: object
      allOf:
      - $ref: '#/components/schemas/TargetSampling'
      - type: object
        properties:
          count:
            type: integer
            format: int32
    ExecutionFailureReasons:
      type: object
      properties:
        executionIdToReason:
          type: object
          additionalProperties:
            type: string
    ExecutionSummary:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        stage:
          type: string
          enum:
          - InvalidArgument
          - TargetNotFound
          - Successful
          - UserHalted
          - ClientAborted
          - LostCommunication
          - InitializationFailed
          - TeardownFailed
          - HaltFailed
          - Failed
          - Pending
          - Distributed
          - Initializing
          - HaltDistributed
          - InterruptTriggered
          - RollbackTriggered
          - RollbackStarted
          - Running
          - TearingDown
          - Halt
        version:
          type: integer
          format: int64
    HostTarget:
      type: object
      allOf:
      - $ref: '#/components/schemas/TargetingStrategy'
      - type: object
        properties:
          ids:
            type: array
            items:
              type: string
          isAll:
            type: boolean
          multiSelectTags:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
    InfraCommandArgs:
      type: object
      properties:
        type:
          type: string
          enum:
          - CPU
          - IO
          - Memory
          - Disk
          - Thread_Bomb
          - Blackhole
          - DNS
          - Latency
          - Packet_Loss
          - Collect_Certs
          - Shutdown
          - Time_Travel
          - Process_Killer
          - Process_Exhaustion
          - GPU
          - Unknown
        unknownArgs:
          type: object
          additionalProperties:
            type: string
        duplicateArgs:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
        cliArgs:
          type: array
          items:
            type: string
        lengthOrZero:
          type: integer
          format: int32
    KubernetesTarget:
      type: object
      allOf:
      - $ref: '#/components/schemas/TargetingStrategy'
      - type: object
        properties:
          ids:
            type: array
            items:
              type: string
          names:
            type: array
            items:
              $ref: '#/components/schemas/NameRef'
          labelSelection:
            $ref: '#/components/schemas/LabelSelection'
          isAll:
            type: boolean
          containerSelection:
            $ref: '#/components/schemas/ContainerSelection'
          allSet:
            type: boolean
    LabelSelection:
      required:
      - clusterId
      - labelSelector
      type: object
      properties:
        labelSelector:
          type: string
        clusterId:
          type: string
        allNamespaces:
          type: boolean
        namespaces:
          type: array
          items:
            type: string
    NameRef:
      required:
