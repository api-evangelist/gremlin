openapi: 3.2.0
info:
  title: Gremlin Schedules API
  description: The API for interacting with the Gremlin Failure-as-a-Service platform
  termsOfService: https://www.gremlin.com/terms_of_service_2017_03_24
  contact:
    name: Gremlin Support
    email: support@gremlin.com
  license:
    name: Gremlin License
    url: https://www.gremlin.com/license_2017_03_24
  version: '1.0'
servers:
- url: /v1
tags:
- name: Schedules
  description: Get, create, and delete schedules
paths:
  /schedules/attacks:
    get:
      tags:
      - Schedules
      summary: Get all active experiment schedules.
      description: Requires the privilege `EXPERIMENTS_READ`
      operationId: getAttackSchedules
      parameters:
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleResponse'
        '403':
          description: 'User requires privilege for target team: EXPERIMENTS_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      deprecated: true
      security:
      - privilege:
        - EXPERIMENTS_READ
    post:
      tags:
      - Schedules
      summary: Create an attack schedule
      description: Requires the privilege `EXPERIMENTS_RUN`
      operationId: createAttackSchedule
      parameters:
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Input'
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '403':
          description: 'User requires privilege for target team: EXPERIMENTS_RUN'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - EXPERIMENTS_RUN
  /schedules:
    post:
      tags:
      - Schedules
      summary: This functionality has moved to POST /schedules/attacks
      description: Requires the privilege `EXPERIMENTS_RUN`
      operationId: createAttackScheduleLegacy
      parameters:
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Input'
      responses:
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '403':
          description: 'User requires privilege for target team: EXPERIMENTS_RUN'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      deprecated: true
      security:
      - privilege:
        - EXPERIMENTS_RUN
  /schedules/scenarios:
    get:
      tags:
      - Schedules
      summary: Get all scenario schedules.
      description: Requires the privilege `SCENARIOS_READ`
      operationId: getScenarioSchedules_1
      parameters:
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScenarioScheduleResponse'
        '403':
          description: 'User requires privilege for target team: SCENARIOS_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      deprecated: true
      security:
      - privilege:
        - SCENARIOS_READ
    post:
      tags:
      - Schedules
      summary: Create a scenario schedule
      description: Requires the privilege `SCENARIOS_RUN`
      operationId: createScenarioSchedule
      parameters:
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScenarioScheduleRequest'
      responses:
        '201':
          description: Guid of the created scenario schedule
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Bad Request
        '404':
          description: Scenario not found
        '409':
          description: A schedule already exists for this scenario
        '403':
          description: 'User requires privilege for target team: SCENARIOS_RUN'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SCENARIOS_RUN
  /schedules/attacks/{guid}:
    get:
      tags:
      - Schedules
      summary: Get an attack schedule
      description: Requires the privilege `EXPERIMENTS_READ`
      operationId: getSingleAttackSchedule
      parameters:
      - name: guid
        in: path
        description: This value represents the globally unique identifier of the record to fetch.
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '404':
          description: Not found
        '403':
          description: 'User requires privilege for target team: EXPERIMENTS_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - EXPERIMENTS_READ
    delete:
      tags:
      - Schedules
      summary: Delete an attack schedule
      description: Requires the privilege `HALT_WRITE`
      operationId: deleteAttackSchedule
      parameters:
      - name: guid
        in: path
        description: This value represents the globally unique identifier of the record to fetch.
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Attack schedule deleted
        '404':
          description: Not found
        '403':
          description: 'User requires privilege for target team: HALT_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - HALT_WRITE
  /schedules/{guid}:
    get:
      tags:
      - Schedules
      summary: This functionality has moved to GET /schedules/attacks/{guid}
      description: Requires the privilege `EXPERIMENTS_READ`
      operationId: getSingleAttackScheduleLegacy
      parameters:
      - name: guid
        in: path
        description: This value represents the globally unique identifier of the record to fetch.
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '404':
          description: Not found
        '403':
          description: 'User requires privilege for target team: EXPERIMENTS_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      deprecated: true
      security:
      - privilege:
        - EXPERIMENTS_READ
    delete:
      tags:
      - Schedules
      summary: This functionality has moved to DELETE /schedules/attacks/{guid}
      description: Requires the privilege `HALT_WRITE`
      operationId: deleteAttackScheduleLegacy
      parameters:
      - name: guid
        in: path
        description: This value represents the globally unique identifier of the record to fetch.
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Attack schedule deleted
        '404':
          description: Not found
        '403':
          description: 'User requires privilege for target team: HALT_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      deprecated: true
      security:
      - privilege:
        - HALT_WRITE
  /schedules/scenarios/{guid}:
    get:
      tags:
      - Schedules
      summary: Get a scenario schedule
      description: Requires the privilege `SCENARIOS_READ`
      operationId: getSingleScenarioSchedule
      parameters:
      - name: guid
        in: path
        description: This value represents the globally unique identifier of the record to fetch.
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioScheduleResponse'
        '404':
          description: Not found
        '403':
          description: 'User requires privilege for target team: SCENARIOS_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SCENARIOS_READ
    put:
      tags:
      - Schedules
      summary: Update a scenario schedule
      description: Requires the privilege `SCENARIOS_WRITE`
      operationId: updateScenarioSchedule
      parameters:
      - name: guid
        in: path
        description: This value represents the globally unique identifier of the record to fetch.
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScenarioScheduleRequest'
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: string
        '400':
          description: Bad Request
        '404':
          description: Not found
        '403':
          description: 'User requires privilege for target team: SCENARIOS_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SCENARIOS_WRITE
    delete:
      tags:
      - Schedules
      summary: Delete a scenario schedule
      description: Requires the privilege `SCENARIOS_WRITE`
      operationId: deleteScenarioSchedule
      parameters:
      - name: guid
        in: path
        description: This value represents the globally unique identifier of the record to fetch.
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Scenario schedule deleted
        '404':
          description: Not found
        '403':
          description: 'User requires privilege for target team: SCENARIOS_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SCENARIOS_WRITE
  /schedules/scenarios/{guid}/enabled:
    post:
      tags:
      - Schedules
      summary: Enable a scenario schedule
      description: Requires the privilege `SCENARIOS_WRITE`
      operationId: enableScenarioSchedule
      parameters:
      - name: guid
        in: path
        description: This value represents the globally unique identifier of the record to fetch.
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Scenario schedule enabled
        '400':
          description: Bad Request
        '404':
          description: Not found
        '403':
          description: 'User requires privilege for target team: SCENARIOS_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SCENARIOS_WRITE
    delete:
      tags:
      - Schedules
      summary: Disable a scenario schedule
      description: Requires the privilege `SCENARIOS_WRITE`
      operationId: disableScenarioSchedule
      parameters:
      - name: guid
        in: path
        description: This value represents the globally unique identifier of the record to fetch.
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Scenario schedule disabled
        '404':
          description: Not found
        '403':
          description: 'User requires privilege for target team: SCENARIOS_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SCENARIOS_WRITE
  /schedules/active:
    get:
      tags:
      - Schedules
      summary: This functionality has moved to GET /schedules/attacks
      description: Requires the privilege `EXPERIMENTS_READ`
      operationId: getAttackSchedulesLegacy
      parameters:
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleResponse'
        '403':
          description: 'User requires privilege for target team: EXPERIMENTS_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      deprecated: true
      security:
      - privilege:
        - EXPERIMENTS_READ
  /schedules/attacks/paged:
    get:
      tags:
      - Schedules
      summary: Paginated endpoint for listing a team's experiment schedules ordered by trigger…
      description: Requires the privilege `EXPERIMENTS_READ`
      operationId: getPaginatedAttackSchedules
      parameters:
      - name: pageSize
        in: query
        description: This value determines how many results will be returned per call.
        schema:
          type: integer
          format: int32
        example: None (unlimited)
      - name: pageToken
        in: query
        description: Pass the pageToken to get the next page of experiment schedules
        schema:
          type: string
        example: None (returns first page)
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseScheduleResponse'
        '403':
          description: 'User requires privilege for target team: EXPERIMENTS_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - EXPERIMENTS_READ
  /schedules/scenarios/paged:
    get:
      tags:
      - Schedules
      summary: Paginated endpoint for listing a team's scenario schedules ordered by trigger…
      description: Requires the privilege `SCENARIOS_READ`
      operationId: getPaginatedScenarioSchedules
      parameters:
      - name: pageSize
        in: query
        description: This value determines how many results will be returned per call.
        schema:
          type: integer
          format: int32
        example: None (unlimited)
      - name: pageToken
        in: query
        description: Pass the pageToken to get the next page of scenario schedules
        schema:
          type: string
        example: None (returns first page)
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseScenarioScheduleResponse'
        '403':
          description: 'User requires privilege for target team: SCENARIOS_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SCENARIOS_READ
  /schedules/services/paged:
    get:
      tags:
      - Schedules
      summary: Paginated endpoint for listing a team's service schedules ordered by trigger…
      description: Requires the privilege `SERVICES_READ`
      operationId: getPaginatedServiceSchedules
      parameters:
      - name: pageSize
        in: query
        description: This value determines how many results will be returned per call.
        schema:
          type: integer
          format: int32
        example: None (unlimited)
      - name: pageToken
        in: query
        description: Pass the pageToken to get the next page of service schedules
        schema:
          type: string
        example: None (returns first page)
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseServiceScheduleResponse'
        '403':
          description: 'User requires privilege for target team: SERVICES_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_READ
components:
  schemas:
    TargetingStrategy:
      required:
      - type
      type: object
      properties:
        type:
          type: string
      discriminator:
        propertyName: type
    TaskTrafficImpactMappingInput:
      type: object
      properties:
        multiSelectTags:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        dependencyIds:
          type: array
          items:
            type: string
    PagedResponseScenarioScheduleResponse:
      type: object
      properties:
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          description: 'The size of the page requested. If none was supplied this is a default value (depending on the endpoint).

            If the length of items is less than this number that means there are _no_ more pages to request.


            NOTE: if the length *is* equal there may or may not be additional pages to request, it is unknowable until they are requested

            '
          format: int32
        pageToken:
          type: string
          description: Supply this token on successive requests to retrieve the next page if there is one
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioScheduleResponse'
    ServiceCommand:
      type: object
      properties:
        infraCommandType:
          type: string
          enum:
          - cpu
          - io
          - memory
          - disk
          - thread_bomb
          - blackhole
          - dns
          - latency
          - packet_loss
          - collect_certs
          - shutdown
          - time_travel
          - process_killer
          - process_exhaustion
          - gpu
        infraCommandArgs:
          $ref: '#/components/schemas/InfraCommandArgs'
    FailureFlagTarget:
      type: object
      properties:
        app:
          $ref: '#/components/schemas/Selector'
        flag:
          $ref: '#/components/schemas/Selector'
        appInstanceSampling:
          $ref: '#/components/schemas/TargetSampling'
        resolvedAppInstanceIds:
          type: array
          items:
            type: string
        resolvedRuntimeLabels:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    ScenarioScheduleResponse:
      type: object
      properties:
        orgId:
          type: string
        guid:
          type: string
        scenarioId:
          type: string
        scenarioName:
          type: string
        trigger:
          $ref: '#/components/schemas/ScheduleTrigger'
        createdBy:
          type: string
        createSource:
          type: string
          enum:
          - WebApp
          - Api
          - Scheduled
          - Manual
          - Spinnaker
          - Concord
          - GremlinFeeder
          - GremlinSdkPython
          - Scenario
          - Chao
          - K8sBackend
          - Website
          - Neotys
          - IntegrationClient
          - Validation
        triggerSource:
          type: string
          enum:
          - MANUAL
          - RUN_ALL
          - SCHEDULED
          - RECURRING_SCHEDULE
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        nextTriggerTime:
          type: string
          format: date-time
        targets:
          type: array
          items:
            $ref: '#/components/schemas/ServiceTarget'
        failureFlagTargets:
          type: array
          items:
            $ref: '#/components/schemas/FailureFlagTarget'
    Input:
      type: object
      properties:
        command:
          type: object
          properties:
            providers:
              type: array
              items:
                type: string
            args:
              type: array
              items:
                type: string
            trafficImpactMapping:
              $ref: '#/components/schemas/TaskTrafficImpactMappingInput'
            trafficImpactFromWithSelectTags:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              writeOnly: true
            trafficImpactWithDependencyIds:
              type: array
              writeOnly: true
              items:
                type: string
            type:
              type: string
            optionalTemplateId:
              type: string
            templateId:
              type: string
            empty:
              type: boolean
          additionalProperties:
            type: object
        target:
          type: object
          properties:
            multiSelectTags:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
            strategyInput:
              $ref: '#/components/schemas/TargetStrategy'
            multiSelectLabels:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
            type:
              type: string
            optionalTemplateId:
              type: string
            templateId:
              type: string
            empty:
              type: boolean
            tags:
              type: object
              additionalProperties:
                type: string
              writeOnly: true
          additionalProperties:
            type: object
        trigger:
          $ref: '#/components/schemas/ScheduleTrigger'
        attackConfiguration:
          $ref: '#/components/schemas/AttackConfiguration'
    UpdateScenarioScheduleRequest:
      required:
      - trigger
      type: object
      properties:
        trigger:
          $ref: '#/components/schemas/RandomTrigger'
        enabled:
          type: boolean
          description: Enable or disable the schedule. Omitting it keeps the current value, which blocks edits to an enabled schedule during its active window.
    ScheduleTrigger:
      discriminator:
        propertyName: type
        mapping:
          Once: '#/components/schemas/OnceTrigger'
          Random: '#/components/schemas/RandomTrigger'
      oneOf:
      - $ref: '#/components/schemas/OnceTrigger'
      - $ref: '#/components/schemas/RandomTrigger'
    AttackConfiguration:
      required:
      - command
      - targets
      type: object
      properties:
        command:
          $ref: '#/components/schemas/ServiceCommand'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/ServiceTarget'
        sampling:
          $ref: '#/components/schemas/TargetSampling'
    TargetSampling:
      required:
      - type
      type: object
      properties:
        type:
          type: string
      discriminator:
        propertyName: type
    CreateScenarioScheduleRequest:
      title: ScenarioSchedule.Input
      required:
      - scenarioId
      - trigger
      type: object
      properties:
        trigger:
          $ref: '#/components/schemas/RandomTrigger'
        enabled:
          type: boolean
          description: Whether the schedule is active. Defaults to true.
        scenarioId:
          type: string
          description: Guid of a scenario that has been run at least once.
    Selector:
      required:
      - labels
      - name
      type: object
      properties:
        name:
          type: string
        labels:
          type: object
          additionalProperties:
            type: array
            description: Label selectors for matching resources
            example:
              foo:
              - bar
              - baz
            items:
              type: string
              description: Label selectors for matching resources
              example: '{"foo":["bar","baz"]}'
          description: Label selectors for matching resources
          example:
            foo:
            - bar
            - baz
        runtimeLabels:
          type: object
          additionalProperties:
            type: array
            description: Labels for matching resources resolved at runtime (e.g., "zones" are resolved and added to the label "ips")
            example:
              zones:
              - us-west-1a
              - us-west-1b
            items:
              type: string
              description: Labels for matching resources resolved at runtime (e.g., "zones" are resolved and added to the label "ips")
              example: '{"zones":["us-west-1a","us-west-1b"]}'
          description: Labels for matching resources resolved at runtime (e.g., "zones" are resolved and added to the label "ips")
          example:
            zones:
            - us-west-1a
            - us-west-1b
    PagedResponseScheduleResponse:
      type: object
      properties:
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          description: 'The size of the page requested. If none was supplied this is a default value (depending on the endpoint).

            If the length of items is less than this number that means there are _no_ more pages to request.


            NOTE: if the length *is* equal there may or may not be additional pages to request, it is unknowable until they are requested

            '
          format: int32
        pageToken:
          type: string
          description: Supply this token on successive requests to retrieve the next page if there is one
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleResponse'
    TargetStrategy:
      type: object
      properties:
        type:
          type: string
          enum:
          - Exact
          - Regex
          - Random
        strategy:
          $ref: '#/components/schemas/Strategy'
        containerLabels:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        hostTags:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
