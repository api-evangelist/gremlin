openapi: 3.2.0
info:
  title: Gremlin Teams Legacy API
  description: The API for interacting with the Gremlin Failure-as-a-Service platform
  termsOfService: https://www.gremlin.com/terms_of_service_2017_03_24
  contact:
    name: Gremlin Support
    email: support@gremlin.com
  license:
    name: Gremlin License
    url: https://www.gremlin.com/license_2017_03_24
  version: '1.0'
servers:
- url: /v1
tags:
- name: teams-legacy
  description: Get and update team preferences. Generate new and delete old client certificates
paths:
  /orgs/auth/certificate:
    get:
      tags:
      - teams-legacy
      summary: Gets the secret key and certificate for this team in PEM format (zipped)
      description: Requires the privilege `TEAM_SECURITY_READ`
      operationId: downloadClientCredentials
      parameters:
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/octet-stream: {}
        '403':
          description: 'User requires privilege for target team: TEAM_SECURITY_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - TEAM_SECURITY_READ
    post:
      tags:
      - teams-legacy
      summary: Rolls over to use a new certificate.
      description: Requires the privilege `TEAM_SECURITY_WRITE`
      operationId: addNewCertificate
      parameters:
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/octet-stream: {}
        '403':
          description: 'User requires privilege for target team: TEAM_SECURITY_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - TEAM_SECURITY_WRITE
    delete:
      tags:
      - teams-legacy
      summary: Deletes the current credentials and generates new.
      description: Requires the privilege `TEAM_SECURITY_WRITE`
      operationId: replaceCertificate
      parameters:
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/octet-stream: {}
        '403':
          description: 'User requires privilege for target team: TEAM_SECURITY_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - TEAM_SECURITY_WRITE
  /orgs:
    get:
      tags:
      - teams-legacy
      summary: Get all Teams
      description: Requires the privilege `TEAMS_READ`
      operationId: info
      parameters:
      - name: prefs
        in: query
        description: Whether to retrieve preferences for the teams in the response.
        schema:
          type: boolean
      responses:
        default:
          description: default response
          content:
            application/json: {}
        '403':
          description: 'User requires privilege: TEAMS_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - TEAMS_READ
    post:
      tags:
      - teams-legacy
      summary: Creates a new Team with provided name
      description: Requires the privilege `COMPANIES_WRITE`
      operationId: create_2
      parameters:
      - name: addUser
        in: query
        description: Whether the user creating the team should be added to the team. Defaults to true.
        schema:
          type: boolean
          default: true
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
              - name
              type: object
              properties:
                name:
                  maxLength: 64
                  minLength: 1
                  type: string
      responses:
        default:
          description: default response
          content:
            application/json: {}
        '403':
          description: 'User requires privilege: COMPANIES_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - COMPANIES_WRITE
  /orgs/{identifier}:
    get:
      tags:
      - teams-legacy
      summary: Get the specified Team
      description: Requires the privilege `TEAMS_READ`
      operationId: info_1
      parameters:
      - name: identifier
        in: path
        description: The identifier of the team to retrieve.
        required: true
        schema:
          type: string
      - name: prefs
        in: query
        description: Whether to retrieve preferences for the team in the response.
        schema:
          type: boolean
      responses:
        default:
          description: default response
          content:
            application/json: {}
        '403':
          description: 'User requires privilege: TEAMS_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - TEAMS_READ
  /orgs/auth/certificate/old:
    delete:
      tags:
      - teams-legacy
      summary: Deletes the old certificate for this team.
      description: Requires the privilege `TEAM_SECURITY_WRITE`
      operationId: invalidateOldCertificate
      parameters:
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            text/plain: {}
        '403':
          description: 'User requires privilege for target team: TEAM_SECURITY_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - TEAM_SECURITY_WRITE
  /orgs/auth/secret/reset:
    post:
      tags:
      - teams-legacy
      summary: Resets the secret for this Team
      description: Requires the privilege `TEAM_SECURITY_WRITE`
      operationId: secretReset
      parameters:
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
              - identifier
              type: object
              properties:
                identifier:
                  type: string
      responses:
        default:
          description: default response
          content:
            application/json: {}
        '403':
          description: 'User requires privilege for target team: TEAM_SECURITY_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - TEAM_SECURITY_WRITE
