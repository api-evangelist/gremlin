openapi: 3.2.0
info:
  title: Gremlin Services API
  description: The API for interacting with the Gremlin Failure-as-a-Service platform
  termsOfService: https://www.gremlin.com/terms_of_service_2017_03_24
  contact:
    name: Gremlin Support
    email: support@gremlin.com
  license:
    name: Gremlin License
    url: https://www.gremlin.com/license_2017_03_24
  version: '1.0'
servers:
- url: /v1
tags:
- name: Services
  description: Get metrics about intelligent health check target for a service
paths:
  /services/{serviceId}/metrics/{awsResource}:
    get:
      tags:
      - Services
      summary: Gets intelligent health check metrics for an AWS resource on a service
      description: Requires the privilege `SERVICES_READ`
      operationId: getMetrics
      parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
      - name: awsResource
        in: path
        required: true
        schema:
          type: string
      - name: startTime
        in: query
        schema:
          type: integer
          format: int64
      - name: endTime
        in: query
        schema:
          type: integer
          format: int64
      - name: statusCheck
        in: query
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The metrics for the resource
        '400':
          description: Bad Request
        '404':
          description: Not found
        '403':
          description: 'User requires privilege for target team: SERVICES_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_READ
  /services/{serviceId}/dependencies:
    get:
      tags:
      - Services
      summary: Paginated endpoint for listing active dependencies for a given service
      description: Requires the privilege `SERVICES_READ`
      operationId: getActiveDependencies
      parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
      - name: pageSize
        in: query
        description: This value determines how many results will be returned per call.
        schema:
          type: integer
          format: int32
        example: None (unlimited)
      - name: pageToken
        in: query
        description: Token corresponding to the last page of customer services retrieved. Pass the pageToken to get the next page of customer services. Only pageNumber or pageToken accepted along with pageSize
        schema:
          type: string
        example: None (returns first page)
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseDependencyResponse'
        '403':
          description: 'User requires privilege for target team: SERVICES_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_READ
    post:
      tags:
      - Services
      summary: Manually define a new dependency for a given Service
      description: Requires the privilege `SERVICES_WRITE`
      operationId: defineDependency
      parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefineDependencyRequest'
        required: true
      responses:
        default:
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DependencyResponse'
        '403':
          description: 'User requires privilege for target team: SERVICES_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_WRITE
  /services/{serviceId}/dependencies/discovered:
    delete:
      tags:
      - Services
      summary: Deletes all discovered dependencies, including those marked as ignored, for the…
      description: Requires the privilege `SERVICES_WRITE`
      operationId: deleteAllDiscoveredDependencies
      parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
      - name: confirm
        in: query
        schema:
          type: boolean
          default: false
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json: {}
        '403':
          description: 'User requires privilege for target team: SERVICES_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_WRITE
  /services/{serviceId}/dependencies/ignored:
    get:
      tags:
      - Services
      summary: Paginated endpoint for listing ignored dependencies for a given service
      description: Requires the privilege `SERVICES_READ`
      operationId: getIgnoredDependencies
      parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
      - name: pageSize
        in: query
        description: This value determines how many results will be returned per call.
        schema:
          type: integer
          format: int32
        example: None (unlimited)
      - name: pageToken
        in: query
        description: Token corresponding to the last page of customer services retrieved. Pass the pageToken to get the next page of customer services. Only pageNumber or pageToken accepted along with pageSize
        schema:
          type: string
        example: None (returns first page)
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseDependencyResponse'
        '403':
          description: 'User requires privilege for target team: SERVICES_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_READ
    delete:
      tags:
      - Services
      summary: Delete all dependencies that are marked ignored
      description: Requires the privilege `SERVICES_WRITE`
      operationId: deleteAllIgnoredDependencies
      parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json: {}
        '403':
          description: 'User requires privilege for target team: SERVICES_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_WRITE
  /services/{serviceId}/dependencies/{dependencyId}:
    delete:
      tags:
      - Services
      summary: Mark a dependency as ignored, removing it from the list of active dependencies…
      description: Requires the privilege `SERVICES_WRITE`
      operationId: deleteDependency
      parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
      - name: dependencyId
        in: path
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            '*/*': {}
        '403':
          description: 'User requires privilege for target team: SERVICES_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_WRITE
    patch:
      tags:
      - Services
      summary: Update a dependency's name and/or isSPOF flag.
      description: Requires the privilege `SERVICES_WRITE`
      operationId: updateDependency
      parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
      - name: dependencyId
        in: path
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/UpdateDependencyRequest'
        required: true
      responses:
        '200':
          description: Updates dependency's name and/or isSPOF flag
        '400':
          description: Bad Request
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
        '404':
          description: Not found
        '403':
          description: 'User requires privilege for target team: SERVICES_WRITE'
      security:
      - privilege:
        - SERVICES_WRITE
  /services/{serviceId}/dependencies/ignored/{dependencyId}:
    delete:
      tags:
      - Services
      summary: Delete a dependency that is marked as ignored
      description: Requires the privilege `SERVICES_WRITE`
      operationId: deleteIgnoredDependency
      parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
      - name: dependencyId
        in: path
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            '*/*': {}
        '403':
          description: 'User requires privilege for target team: SERVICES_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_WRITE
  /services/{serviceId}/dependencies/{dependencyId}/reliability-test/{reliabilityTestId}/run/{runNumber}.md:
    get:
      tags:
      - Services
      summary: Get a dependency reliability test run rendered as markdown
      description: Requires the privilege `SERVICES_READ`
      operationId: getDependencyReliabilityTestRunMarkdown
      parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
      - name: dependencyId
        in: path
        required: true
        schema:
          type: string
      - name: reliabilityTestId
        in: path
        required: true
        schema:
          type: string
      - name: runNumber
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            text/markdown: {}
        '403':
          description: 'User requires privilege for target team: SERVICES_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_READ
  /services/{serviceId}/dependencies/{dependencyId}/name:
    put:
      tags:
      - Services
      summary: Renames a dependency
      description: Requires the privilege `SERVICES_WRITE`
      operationId: renameDependency
      parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
      - name: dependencyId
        in: path
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      requestBody:
        content:
          text/plain:
            schema:
              maxLength: 253
              minLength: 0
              type: string
        required: true
      responses:
        '204':
          description: Dependency renamed
        '404':
          description: Not found
        '403':
          description: 'User requires privilege for target team: SERVICES_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      deprecated: true
      security:
      - privilege:
        - SERVICES_WRITE
  /services/{serviceId}/dependencies/ignored/{dependencyId}/restore:
    post:
      tags:
      - Services
      summary: Restore a dependency that is marked as ignored, returning it to the list of…
      description: Requires the privilege `SERVICES_WRITE`
      operationId: restoreIgnoredDependency
      parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
      - name: dependencyId
        in: path
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyResponse'
        '403':
          description: 'User requires privilege for target team: SERVICES_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_WRITE
  /services/{serviceId}/failure-flags/{failureFlagName}/reliability-test/{reliabilityTestId}/run/{runNumber}.md:
    get:
      tags:
      - Services
      summary: Get a failure flag reliability test run rendered as markdown
      description: Requires the privilege `SERVICES_READ`
      operationId: getFailureFlagRunMarkdown
      parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
      - name: failureFlagName
        in: path
        required: true
        schema:
          type: string
      - name: reliabilityTestId
        in: path
        required: true
        schema:
          type: string
      - name: runNumber
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            text/markdown: {}
        '403':
          description: 'User requires privilege for target team: SERVICES_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_READ
  /services/{serviceId}/reliability-test/{reliabilityTestId}/run/{runNumber}.md:
    get:
      tags:
      - Services
      summary: Get a reliability test run rendered as markdown
      description: Requires the privilege `SERVICES_READ`
      operationId: getServiceRunMarkdown
      parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
      - name: reliabilityTestId
        in: path
        required: true
        schema:
          type: string
      - name: runNumber
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            text/markdown: {}
        '403':
          description: 'User requires privilege for target team: SERVICES_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_READ
  /services:
    get:
      tags:
      - Services
      summary: Paginated endpoint for fetching services for a given team
      description: Requires the privilege `SERVICES_READ`
      operationId: getAllServices
      parameters:
      - name: pageSize
        in: query
        description: This value determines how many results will be returned per call.
        schema:
          type: integer
          format: int32
        example: None (unlimited)
      - name: pageToken
        in: query
        description: Token corresponding to the last page of customer services retrieved. Pass the pageToken to get the next page of customer services
        schema:
          type: string
        example: None (returns first page)
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseUserDefinedServiceResponse'
        '403':
          description: 'User requires privilege for target team: SERVICES_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_READ
    post:
      tags:
      - Services
      summary: Create a service
      description: Requires the privilege `SERVICES_WRITE`
      operationId: createService
      parameters:
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDefinedServiceRequest'
        required: true
      responses:
        default:
          description: default response
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: 'User requires privilege for target team: SERVICES_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_WRITE
    patch:
      tags:
      - Services
      summary: Bulk add a given Status Check to all services
      description: Requires the privilege `SERVICES_WRITE`
      operationId: bulkAddHealthChecksToServices
      parameters:
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateRequest'
        required: true
      responses:
        '200':
          description: Bulk updates services with health checks
        '400':
          description: Bad Request
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
        '403':
          description: 'User requires privilege for target team: SERVICES_WRITE'
      security:
      - privilege:
        - SERVICES_WRITE
  /services/bulk-create-with-load-balancers:
    post:
      tags:
      - Services
      summary: Bulk create services based on AWS Load balancers
      description: Requires the privilege `SERVICES_WRITE`
      operationId: bulkCreateWithLoadBalancers
      parameters:
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCreateServicesFromLoadBalancersRequest'
        required: true
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '403':
          description: 'User requires privilege for target team: SERVICES_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_WRITE
  /services/bulk-delete:
    post:
      tags:
      - Services
      summary: Bulk delete services
      description: Requires the privilege `SERVICES_WRITE`
      operationId: bulkDeleteServices
      parameters:
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteRequest'
        required: true
      responses:
        default:
          description: default response
          content:
            application/json: {}
        '403':
          description: 'User requires privilege for target team: SERVICES_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_WRITE
  /services/service-creation-readiness/clients:
    post:
      tags:
      - Services
      summary: Retrieves clients for a potential service definition
      description: Requires the privilege `SERVICES_WRITE`
      operationId: computeServiceReadinessAgentsFromPodUIDs
      parameters:
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceReadinessAgentsFromPodUIDsRequest'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceReadinessClientsResponse'
        '403':
          description: 'User requires privilege for target team: SERVICES_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_WRITE
  /services/batch:
    post:
      tags:
      - Services
      summary: Batch create up to 25 services; the whole batch is validated before any service…
      description: Requires the privilege `SERVICES_WRITE`
      operationId: createServicesBatch
      parameters:
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateServicesRequest'
        required: true
      responses:
        '200':
          description: Validation passed and creation was attempted for every service. Inspect each result for success or error
        '400':
          description: At least one item failed validation; nothing in the batch was created. See /services/batch/validate for a structured, per-item error report.
        '403':
          description: 'User requires privilege for target team: SERVICES_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_WRITE
  /services/{serviceId}:
    get:
      tags:
      - Services
      summary: Retrieve a service by id
      description: Requires the privilege `SERVICES_READ`
      operationId: getService
      parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Not Found
        '403':
          description: 'User requires privilege for target team: SERVICES_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_READ
    delete:
      tags:
      - Services
      summary: Permanently delete a service
      description: Requires the privilege `SERVICES_WRITE`
      operationId: delete_6
      parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json: {}
        '403':
          description: 'User requires privilege for target team: SERVICES_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_WRITE
    patch:
      tags:
      - Services
      summary: Update a service, editing some fields
      description: Requires the privilege `SERVICES_WRITE`
      operationId: update_4
      parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceUpdateRequest'
        required: true
      responses:
        '200':
          description: Updates a Service.
        '404':
          description: Not found
        '403':
          description: 'User requires privilege for target team: SERVICES_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_WRITE
  /services/all-for-company:
    get:
      tags:
      - Services
      summary: Paginated endpoint for fetching services for a given company
      description: Requires the privilege `DISASTER_RECOVERY_TESTS_WRITE`
      operationId: getAllServicesForCompany
      parameters:
      - name: pageSize
        in: query
        description: This value determines how many results will be returned per call.
        schema:
          type: integer
          format: int32
          default: 1000
        example: None (defaults to 1000)
      - name: pageToken
        in: query
        description: Token corresponding to the last page of customer services retrieved. Pass the pageToken to get the next page of customer services
        schema:
          type: string
        example: None (returns first page)
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseUserDefinedServiceResponse'
        '403':
          description: 'User requires privilege: DISASTER_RECOVERY_TESTS_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - DISASTER_RECOVERY_TESTS_WRITE
  /services/{id}/risk-summary:
    get:
      tags:
      - Services
      summary: Load risk evaluations for service.
      description: Requires the privilege `SERVICES_READ`
      operationId: getRiskSummary
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedServiceRiskSummaryResponse'
        '403':
          description: 'User requires privilege for target team: SERVICES_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_READ
  /services/service-creation-readiness/{targetType}:
    get:
      tags:
      - Services
