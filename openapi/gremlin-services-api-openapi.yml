        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - SERVICES_RUN
  /services/{serviceId}/baseline:
    post:
      tags:
      - Services
      summary: Run RM tests for a given service
      description: 'By default this endpoint initiates all RM Tests in your Test Suite for this service and every one of it''s dependencies.

        You may also supply a list of RM tests in the body if you which to constrain to a subset of all tests, but they *must* be in the active Test Suite for your team

        Requires the privilege `SERVICES_RUN`'
      operationId: runAllTests
      parameters:
      - name: serviceId
        in: path
        required: true
        schema:
