openapi: 3.2.0
info:
  title: Gremlin Newrelic API
  description: The API for interacting with the Gremlin Failure-as-a-Service platform
  termsOfService: https://www.gremlin.com/terms_of_service_2017_03_24
  contact:
    name: Gremlin Support
    email: support@gremlin.com
  license:
    name: Gremlin License
    url: https://www.gremlin.com/license_2017_03_24
  version: '1.0'
servers:
- url: /v1
tags:
- name: newrelic
  description: Read New Relic items
paths:
  /newrelic/incidents/{incidentId}:
    get:
      tags:
      - newrelic
      summary: Get an incident by id
      description: Requires the privilege `INTEGRATIONS_WRITE`
      operationId: incident
      parameters:
      - name: name
        in: query
        schema:
          type: string
      - name: incidentId
        in: path
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns an incident
        '404':
          description: Not found
        '403':
          description: 'User requires privilege for target team: INTEGRATIONS_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - INTEGRATIONS_WRITE
