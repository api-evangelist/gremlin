      - name: endDate
        in: query
        schema:
          type: string
          format: date
        example: '2026-05-01'
      - name: numberOfDataPoints
        in: query
        schema:
          type: integer
          format: int32
          default: 12
      responses:
        default:
          description: default response
          content:
            application/json:
