openapi: 3.0.1
info:
  title: Gremlin agents reports API
  description: The API for interacting with the Gremlin Failure-as-a-Service platform
  termsOfService: https://www.gremlin.com/terms_of_service_2017_03_24
  contact:
    name: Gremlin Support
    email: support@gremlin.com
  license:
    name: Gremlin License
    url: https://www.gremlin.com/license_2017_03_24
  version: '1.0'
servers:
- url: https://api.gremlin.com/v1
  description: Gremlin API v1
tags:
- name: reports
  description: Get users, clients, and attacks summaries
paths:
  /reports/attacks:
    get:
      tags:
      - reports
      summary: Loads the Attacks Summary for the specified time period.
      description: Requires the privilege [`REPORTS_READ`](https://www.gremlin.com/docs/user-management/access-control/#privileges)
      operationId: attackSummary
      parameters:
      - name: teamId
        in: query
        description: team identifier associated with the requester's team
        required: true
        schema:
          type: string
        example: '2026-05-01'
      - name: start
        in: query
        required: true
        schema:
          type: string
          format: date
        example: '2026-05-01'
      - name: end
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: period
        in: query
        required: true
        schema:
          type: string
          enum:
          - MONTHS
          - WEEKS
          - DAYS
      responses:
        default:
          description: default response
          content:
            application/json: {}
        '403':
          description: 'User requires privilege: REPORTS_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - REPORTS_READ
  /reports/clients:
    get:
      tags:
      - reports
      summary: Loads the Client Summary for the specified time period.
      description: Requires the privilege [`REPORTS_READ`](https://www.gremlin.com/docs/user-management/access-control/#privileges)
      operationId: clientSummary
      parameters:
      - name: teamId
        in: query
        description: team identifier associated with the requester's team
        required: true
        schema:
          type: string
        example: '2026-05-01'
      - name: start
        in: query
        required: true
        schema:
          type: string
          format: date
        example: '2026-05-01'
      - name: end
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: period
        in: query
        required: true
        schema:
          type: string
          enum:
          - MONTHS
          - WEEKS
          - DAYS
      responses:
        default:
          description: default response
          content:
            application/json: {}
        '403':
          description: 'User requires privilege: REPORTS_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - REPORTS_READ
  /reports/companies:
    get:
      tags:
      - reports
      summary: Loads the Company Summary for the specified month.
      description: Requires the privilege [`REPORTS_READ`](https://www.gremlin.com/docs/user-management/access-control/#privileges)
      operationId: companySummary
      parameters:
      - name: startDate
        in: query
        required: true
        schema:
          type: string
          format: date
        example: '2026-05-01'
      - name: endDate
        in: query
        required: true
        schema:
          type: string
          format: date
        example: '2026-05-01'
      responses:
        default:
          description: default response
          content:
            application/json: {}
        '403':
          description: 'User requires privilege: REPORTS_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - REPORTS_READ
  /reports/companies/pdf:
    get:
      tags:
      - reports
      summary: Loads the Company Summary PDF for the specified time frame.
      description: Requires the privilege [`RELIABILITY_REPORTS_READ`](https://www.gremlin.com/docs/user-management/access-control/#privileges)
      operationId: companySummaryPdf
      parameters:
      - name: startDate
        in: query
        schema:
          type: string
          format: date
        example: '2026-05-01'
      - name: endDate
        in: query
        schema:
          type: string
          format: date
        example: '2026-05-01'
      - name: numberOfDataPoints
        in: query
        schema:
          type: integer
          format: int32
          default: 12
      - name: topN
        in: query
        schema:
          type: integer
          format: int32
          default: 3
      - name: filter
        in: query
        schema:
          type: string
      - name: groupBy
        in: query
        schema:
          type: string
          enum:
          - TEAM
      responses:
        default:
          description: default response
          content:
            application/octet-stream: {}
            text/plain: {}
        '403':
          description: 'User requires privilege: RELIABILITY_REPORTS_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - RELIABILITY_REPORTS_READ
  /reports/companies/reliability-management:
    get:
      tags:
      - reports
      summary: Loads the Company Reliability Management Report for the specified time window defaulting to a week.
      description: Requires the privilege [`RELIABILITY_REPORTS_READ`](https://www.gremlin.com/docs/user-management/access-control/#privileges)
      operationId: getCompanyReliabilityManagementReport
      parameters:
      - name: startDate
        in: query
        schema:
          type: string
          format: date
        example: '2026-05-01'
      - name: endDate
        in: query
        schema:
          type: string
          format: date
        example: '2026-05-01'
      - name: topN
        in: query
        schema:
          type: integer
          format: int32
          default: 3
      - name: includeDailyReport
        in: query
        schema:
          type: boolean
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyReliabilityReportResponse'
        '403':
          description: 'User requires privilege: RELIABILITY_REPORTS_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - RELIABILITY_REPORTS_READ
  /reports/companies/reliability-management/services:
    get:
      tags:
      - reports
      summary: Loads the company service list and reliability trend for each service for the specified time window defaulting to a month.
      description: Requires the privilege [`RELIABILITY_REPORTS_READ`](https://www.gremlin.com/docs/user-management/access-control/#privileges)
      operationId: getCompanyReliabilityManagementReport_1
      parameters:
      - name: startDate
        in: query
        schema:
          type: string
          format: date
        example: '2026-05-01'
      - name: endDate
        in: query
        schema:
          type: string
          format: date
        example: '2026-05-01'
      - name: numberOfDataPoints
        in: query
        schema:
          type: integer
          format: int32
          default: 4
      - name: topN
        in: query
        schema:
          type: integer
          format: int32
          default: 3
      - name: filter
        in: query
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyReliabilityReportServiceListResponse'
        '403':
          description: 'User requires privilege: RELIABILITY_REPORTS_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - RELIABILITY_REPORTS_READ
  /reports/companies/reliability-management/grouped:
    get:
      tags:
      - reports
      summary: Loads the Company Reliability Management Report grouped by query param value of groupBy - defaults to TEAM.
      description: Requires the privilege [`RELIABILITY_REPORTS_READ`](https://www.gremlin.com/docs/user-management/access-control/#privileges)
      operationId: getCompanyReliabilityManagementReportGrouped
      parameters:
      - name: groupBy
        in: query
        schema:
          type: string
          default: TEAM
          enum:
          - TEAM
      - name: numberOfDataPoints
        in: query
        schema:
          type: integer
          format: int32
          default: 4
      - name: filter
        in: query
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyReliabilityReportGroupedResponse'
        '403':
          description: 'User requires privilege: RELIABILITY_REPORTS_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - RELIABILITY_REPORTS_READ
  /reports/companies/trends:
    get:
      tags:
      - reports
      summary: Returns the Risk and Score trends for your company across all associated services
      description: Requires the privilege [`RELIABILITY_REPORTS_READ`](https://www.gremlin.com/docs/user-management/access-control/#privileges)
      operationId: getCompanyScoreRiskTrends
      parameters:
      - name: startDate
        in: query
        schema:
          type: string
          format: date
        example: '2026-05-01'
      - name: endDate
        in: query
        schema:
          type: string
          format: date
        example: '2026-05-01'
      - name: numberOfDataPoints
        in: query
        schema:
          type: integer
          format: int32
          default: 12
      - name: filter
        in: query
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreRiskTrend'
        '403':
          description: 'User requires privilege: RELIABILITY_REPORTS_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - RELIABILITY_REPORTS_READ
  /reports/team/detected-risk/trend:
    get:
      tags:
      - reports
      summary: Returns the trend of risks across all services for a given team
      description: Requires the privilege [`RELIABILITY_REPORTS_READ`](https://www.gremlin.com/docs/user-management/access-control/#privileges)
