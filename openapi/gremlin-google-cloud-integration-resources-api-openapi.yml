openapi: 3.2.0
info:
  title: Gremlin Google Cloud.integration.resources API
  description: The API for interacting with the Gremlin Failure-as-a-Service platform
  termsOfService: https://www.gremlin.com/terms_of_service_2017_03_24
  contact:
    name: Gremlin Support
    email: support@gremlin.com
  license:
    name: Gremlin License
    url: https://www.gremlin.com/license_2017_03_24
  version: '1.0'
servers:
- url: /v1
tags:
- name: google-cloud.integration.resources
  description: 'List resources Gremlin has discovered through a configured integration. Note: Paging is currently not supported for Private Edition.'
paths:
  /gcp/integrations/{integrationId}/resources/all:
    get:
      tags:
      - google-cloud.integration.resources
      summary: Lists resources discovered through the integration
      description: Requires the privilege `MINIMUM_TEAM_PRIVILEGES`
      operationId: all_1
      parameters:
      - name: integrationId
        in: path
        required: true
        schema:
          type: string
      - name: pageToken
        in: query
        schema:
          $ref: '#/components/schemas/AllPageToken'
      - name: pageSize
        in: query
        description: This value determines how many results will be returned per call.
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Resources discovered through the integration
        '404':
          description: Not found
        '403':
          description: 'User requires privilege for target team: MINIMUM_TEAM_PRIVILEGES'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - MINIMUM_TEAM_PRIVILEGES
components:
  schemas:
    AllPageToken:
      type: object
      properties:
        typeIndex:
          type: integer
          format: int32
        inner:
          type: string
