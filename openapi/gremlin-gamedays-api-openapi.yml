      security:
      - privilege:
        - MINIMUM_TEAM_PRIVILEGES
    patch:
      tags:
      - gamedays
      summary: Updates a GameDay plan, with status-check credentials masked
      description: Requires the privilege `MINIMUM_TEAM_PRIVILEGES`
      operationId: updateGameDayDelegate
      parameters:
      - name: gameDayId
        in: path
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGameDayPlanRequest'
        required: true
      responses:
        '200':
          description: Updates a GameDay plan.
        '400':
          description: Bad request
        '404':
          description: Not found
        '403':
          description: 'User requires privilege for target team: MINIMUM_TEAM_PRIVILEGES'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - MINIMUM_TEAM_PRIVILEGES
  /gamedays/delegate:
    get:
      tags:
      - gamedays
      summary: Get all GameDays by team, with status-check credentials masked
      description: Requires the privilege `MINIMUM_TEAM_PRIVILEGES`
      operationId: getGameDaysForTeamDelegate
      parameters:
      - name: pageSize
        in: query
        description: This value determines how many results will be returned per call.
        schema:
          type: integer
          format: int32
        example: None (unlimited)
      - name: pageNumber
