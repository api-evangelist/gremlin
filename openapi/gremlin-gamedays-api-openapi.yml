components:
  schemas:
    Participant:
      title: CreateGameDayPlanRequest.Participant
      required:
      - position
      type: object
      properties:
        position:
          type: string
          enum:
          - Owner
          - Coordinator
          - Observer
          - Reporter
        email:
          type: string
      description: Represents a participant in the GameDay
    UpdateGameDaySummaryRequest:
      title: UpdateGameDaySummaryRequest.Input
      type: object
      properties:
        notes:
          type: string
        actions:
          type: string
      description: Represents a request to update a GameDay summary for a team
    FormDataContentDisposition:
      type: object
      properties:
        type:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
        fileName:
          type: string
        creationDate:
          type: string
          format: date-time
        modificationDate:
          type: string
          format: date-time
        readDate:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
        name:
          type: string
    UpdateGameDayPlanRequest:
      title: UpdateGameDayPlanRequest.Input
      type: object
      properties:
        name:
          type: string
        goal:
          type: string
        type:
          type: string
          enum:
          - Exploratory
          - TrainTeams
          - ValidatePastOutages
          - TuneObservability
          - Other
        participants:
          maxItems: 20
          minItems: 0
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        scenarioIds:
          maxItems: 20
          minItems: 0
          type: array
          items:
            type: string
        environment:
          type: string
        dashboards:
          maxItems: 20
          minItems: 0
          type: array
          items:
            type: string
            format: uri
        runbooks:
          maxItems: 20
          minItems: 0
          type: array
          items:
            type: string
            format: uri
      description: Represents a request to update a GameDay plan for a team
    CreateGameDayPlanRequest:
      title: CreateGameDayPlanRequest.Input
      required:
      - name
      type: object
      properties:
        name:
          type: string
        goal:
          type: string
        type:
          type: string
          enum:
          - Exploratory
          - TrainTeams
          - ValidatePastOutages
          - TuneObservability
          - Other
        participants:
          maxItems: 20
          minItems: 0
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        scenarioIds:
          maxItems: 20
          minItems: 0
          type: array
          items:
            type: string
        environment:
          type: string
        dashboards:
          maxItems: 20
          minItems: 0
          type: array
          items:
            type: string
            format: uri
        runbooks:
          maxItems: 20
          minItems: 0
          type: array
          items:
            type: string
            format: uri
      description: Represents a request to create a GameDay plan for a team
