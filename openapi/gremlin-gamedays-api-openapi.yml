  /gamedays/{gameDayId}/summary/images/{imageName}/delegate:
    patch:
      tags:
      - gamedays
      summary: Upload an image to a given gameday, with status-check credentials masked
      description: 'This takes an image as a multipart/form-data (parameter name "file") and uploads it to Gremlin''s backend and associates it with a given Gameday.

        NOTE: imageNames must be S3 compatible strings ([a-zA-Z0-9!-_''\(\)]) with under 1000 characters (including file type)

        Requires the privilege `MINIMUM_TEAM_PRIVILEGES`'
      operationId: putDelegate
      parameters:
      - name: imageName
        in: path
        required: true
