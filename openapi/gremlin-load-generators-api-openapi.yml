openapi: 3.2.0
info:
  title: Gremlin Load Generators API
  description: The API for interacting with the Gremlin Failure-as-a-Service platform
  termsOfService: https://www.gremlin.com/terms_of_service_2017_03_24
  contact:
    name: Gremlin Support
    email: support@gremlin.com
  license:
    name: Gremlin License
    url: https://www.gremlin.com/license_2017_03_24
  version: '1.0'
servers:
- url: /v1
tags:
- name: load-generators
  description: Create, read, update, and delete LoadGenerators
paths:
  /load-generator:
    post:
      tags:
      - load-generators
      summary: Create Load Generator
      description: 'Creates a load generator on a service. Set `type` to WEBHOOK (default) or EXTERNAL; see the request schema for the fields each type requires. Returns the created load generator with its generated identifier. For EXTERNAL, the team integration named in the request must already exist, otherwise the call fails with 404.

        Requires the privilege `WEBHOOKS_WRITE`'
      operationId: createLoadGenerator
      parameters:
      - name: serviceId
        in: query
        description: The id of the service the load generator belongs to
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      requestBody:
        description: The load generator to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadGeneratorRequest'
            examples:
              Webhook:
                description: Webhook
                value:
                  name: Checkout load test
                  type: WEBHOOK
                  active: true
                  webhookStartLoadTrigger:
                    name: LOAD_GENERATOR_TRIGGER
                    uri: https://loadtest.example.com/api/start
                    method: POST
                    isPrivateNetwork: false
                    payload: '{"testId": "abc123"}'
                  webhookStatusCheck:
                    name: LOAD_GENERATOR_STATUS_CHECK
                    uri: https://loadtest.example.com/api/status
                    method: GET
                    isPrivateNetwork: false
                  webhookStopLoadTrigger:
                    name: LOAD_GENERATOR_STOP
                    uri: https://loadtest.example.com/api/stop
                    method: POST
                    isPrivateNetwork: false
              External:
                description: External
                value:
                  name: Checkout load test
                  type: EXTERNAL
                  active: true
                  externalIntegrationType: <type of an existing load generator team integration>
                  externalIntegrationName: <name of that team integration>
                  externalTestId: <id of the test in the external system>
        required: true
      responses:
        '201':
          description: The created load generator. The body is a JSON object whose `identifier` is the id of the load generator, use GET to read it back in full
        '400':
          description: 'Invalid request: missing or blank required fields for the type, a webhook with the wrong name, an unsupported `externalIntegrationType`, or an attempt to change the type'
        '404':
          description: The service, the load generator, or the named external integration does not exist
        '403':
          description: 'User requires privilege for target team: WEBHOOKS_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - WEBHOOKS_WRITE
  /load-generator/delegate:
    post:
      tags:
      - load-generators
      summary: Create Load Generator, refusing an integration whose credentials belong to…
      description: 'Creates a load generator on a service. Set `type` to WEBHOOK (default) or EXTERNAL; see the request schema for the fields each type requires. Returns the created load generator with its generated identifier. For EXTERNAL, the team integration named in the request must already exist, otherwise the call fails with 404. For WEBHOOK load generators, refuses an integration whose credentials belong to another host and webhooks that are not the load generator''s own. EXTERNAL load generators have no webhooks, so nothing extra is checked.

        Requires the privilege `WEBHOOKS_WRITE`'
      operationId: createLoadGeneratorDelegate
      parameters:
      - name: serviceId
        in: query
        description: The id of the service the load generator belongs to
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      requestBody:
        description: The load generator to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadGeneratorRequest'
            examples:
              Webhook:
                description: Webhook
                value:
                  name: Checkout load test
                  type: WEBHOOK
                  active: true
                  webhookStartLoadTrigger:
                    name: LOAD_GENERATOR_TRIGGER
                    uri: https://loadtest.example.com/api/start
                    method: POST
                    isPrivateNetwork: false
                    payload: '{"testId": "abc123"}'
                  webhookStatusCheck:
                    name: LOAD_GENERATOR_STATUS_CHECK
                    uri: https://loadtest.example.com/api/status
                    method: GET
                    isPrivateNetwork: false
                  webhookStopLoadTrigger:
                    name: LOAD_GENERATOR_STOP
                    uri: https://loadtest.example.com/api/stop
                    method: POST
                    isPrivateNetwork: false
              External:
                description: External
                value:
                  name: Checkout load test
                  type: EXTERNAL
                  active: true
                  externalIntegrationType: <type of an existing load generator team integration>
                  externalIntegrationName: <name of that team integration>
                  externalTestId: <id of the test in the external system>
        required: true
      responses:
        '201':
          description: The created load generator. The body is a JSON object whose `identifier` is the id of the load generator, use GET to read it back in full
        '400':
          description: 'Invalid request: missing or blank required fields for the type, a webhook with the wrong name, an unsupported `externalIntegrationType`, or an attempt to change the type'
        '404':
          description: The service, the load generator, or the named external integration does not exist
        '403':
          description: 'User requires privilege for target team: WEBHOOKS_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - WEBHOOKS_WRITE
  /load-generator/{guid}:
    get:
      tags:
      - load-generators
      summary: Retrieve Load Generator by id
      description: 'Returns the load generator. WEBHOOK load generators populate the webhook fields and EXTERNAL load generators populate the external fields.

        Requires the privilege `WEBHOOKS_READ`'
      operationId: getLoadGenerators
      parameters:
      - name: guid
        in: path
        description: This value represents the globally unique identifier of the record to fetch.
        required: true
        schema:
          type: string
      - name: serviceId
        in: query
        description: The id of the service the load generator belongs to
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The load generator
        '404':
          description: The service, the load generator, or the named external integration does not exist
        '403':
          description: 'User requires privilege for target team: WEBHOOKS_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - WEBHOOKS_READ
    put:
      tags:
      - load-generators
      summary: Update a given Load Generator
      description: 'Updates a load generator on a service. Send the full load generator, as in create. The `type` cannot be changed: sending a different type than the stored one fails with 400. The identifier in the URL is the one that is updated.

        Requires the privilege `WEBHOOKS_WRITE`'
      operationId: updateLoadGenerator
      parameters:
      - name: guid
        in: path
        description: This value represents the globally unique identifier of the record to fetch.
        required: true
        schema:
          type: string
      - name: serviceId
        in: query
        description: The id of the service the load generator belongs to
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      requestBody:
        description: The load generator to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadGeneratorRequest'
            examples:
              Webhook:
                description: Webhook
                value:
                  name: Checkout load test
                  type: WEBHOOK
                  active: true
                  webhookStartLoadTrigger:
                    name: LOAD_GENERATOR_TRIGGER
                    uri: https://loadtest.example.com/api/start
                    method: POST
                    isPrivateNetwork: false
                    payload: '{"testId": "abc123"}'
                  webhookStatusCheck:
                    name: LOAD_GENERATOR_STATUS_CHECK
                    uri: https://loadtest.example.com/api/status
                    method: GET
                    isPrivateNetwork: false
                  webhookStopLoadTrigger:
                    name: LOAD_GENERATOR_STOP
                    uri: https://loadtest.example.com/api/stop
                    method: POST
                    isPrivateNetwork: false
              External:
                description: External
                value:
                  name: Checkout load test
                  type: EXTERNAL
                  active: true
                  externalIntegrationType: <type of an existing load generator team integration>
                  externalIntegrationName: <name of that team integration>
                  externalTestId: <id of the test in the external system>
        required: true
      responses:
        '200':
          description: The updated load generator. The body is a JSON object whose `identifier` is the id of the load generator, use GET to read it back in full
        '400':
          description: 'Invalid request: missing or blank required fields for the type, a webhook with the wrong name, an unsupported `externalIntegrationType`, or an attempt to change the type'
        '404':
          description: The service, the load generator, or the named external integration does not exist
        '403':
          description: 'User requires privilege for target team: WEBHOOKS_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - WEBHOOKS_WRITE
    delete:
      tags:
      - load-generators
      summary: Delete a given LoadGenerator
      description: 'Removes the load generator from the service. For WEBHOOK load generators its webhooks are deleted too. An external integration is not affected.

        Requires the privilege `WEBHOOKS_WRITE`'
      operationId: deleteLoadGenerator
      parameters:
      - name: guid
        in: path
        description: This value represents the globally unique identifier of the record to fetch.
        required: true
        schema:
          type: string
      - name: serviceId
        in: query
        description: The id of the service the load generator belongs to
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The load generator was deleted
        '403':
          description: 'User requires privilege for target team: WEBHOOKS_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - WEBHOOKS_WRITE
  /load-generator/{guid}/delegate:
    get:
      tags:
      - load-generators
      summary: Retrieve Load Generator by id, with webhook credentials redacted
      description: 'Same as retrieving by id, but webhook headers and other credentials are redacted.

        Requires the privilege `WEBHOOKS_READ`'
      operationId: getLoadGeneratorDelegate
      parameters:
      - name: guid
        in: path
        description: This value represents the globally unique identifier of the record to fetch.
        required: true
        schema:
          type: string
      - name: serviceId
        in: query
        description: The id of the service the load generator belongs to
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The load generator, redacted
        '404':
          description: The service, the load generator, or the named external integration does not exist
        '403':
          description: 'User requires privilege for target team: WEBHOOKS_READ'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - WEBHOOKS_READ
    put:
      tags:
      - load-generators
      summary: Update a given Load Generator, refusing an integration whose credentials belong…
      description: 'Updates a load generator on a service. Send the full load generator, as in create. The `type` cannot be changed: sending a different type than the stored one fails with 400. The identifier in the URL is the one that is updated. For WEBHOOK load generators, refuses an integration whose credentials belong to another host and webhooks that are not the load generator''s own. EXTERNAL load generators have no webhooks, so nothing extra is checked.

        Requires the privilege `WEBHOOKS_WRITE`'
      operationId: updateLoadGeneratorDelegate
      parameters:
      - name: guid
        in: path
        description: This value represents the globally unique identifier of the record to fetch.
        required: true
        schema:
          type: string
      - name: serviceId
        in: query
        description: The id of the service the load generator belongs to
        required: true
        schema:
          type: string
      - name: teamId
        in: query
        description: Required when using company session token.
        required: true
        schema:
          type: string
      requestBody:
        description: The load generator to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadGeneratorRequest'
            examples:
              Webhook:
                description: Webhook
                value:
                  name: Checkout load test
                  type: WEBHOOK
                  active: true
                  webhookStartLoadTrigger:
                    name: LOAD_GENERATOR_TRIGGER
                    uri: https://loadtest.example.com/api/start
                    method: POST
                    isPrivateNetwork: false
                    payload: '{"testId": "abc123"}'
                  webhookStatusCheck:
                    name: LOAD_GENERATOR_STATUS_CHECK
                    uri: https://loadtest.example.com/api/status
                    method: GET
                    isPrivateNetwork: false
                  webhookStopLoadTrigger:
                    name: LOAD_GENERATOR_STOP
                    uri: https://loadtest.example.com/api/stop
                    method: POST
                    isPrivateNetwork: false
              External:
                description: External
                value:
                  name: Checkout load test
                  type: EXTERNAL
                  active: true
                  externalIntegrationType: <type of an existing load generator team integration>
                  externalIntegrationName: <name of that team integration>
                  externalTestId: <id of the test in the external system>
        required: true
      responses:
        '200':
          description: The updated load generator. The body is a JSON object whose `identifier` is the id of the load generator, use GET to read it back in full
        '400':
          description: 'Invalid request: missing or blank required fields for the type, a webhook with the wrong name, an unsupported `externalIntegrationType`, or an attempt to change the type'
        '404':
          description: The service, the load generator, or the named external integration does not exist
        '403':
          description: 'User requires privilege for target team: WEBHOOKS_WRITE'
        '401':
          description: Authorization header missing or malformed. Please provide proper credentials in the authorization header.
      security:
      - privilege:
        - WEBHOOKS_WRITE
components:
  schemas:
    WebhookRequest:
      required:
      - method
      - name
      - uri
      type: object
      properties:
        identifier:
          type: string
          description: The identifier of this webhook
        name:
          type: string
          description: The name of the webhook to be created/updated
        description:
          type: string
          description: The description of the webhook to be created/updated
        isPrivateNetwork:
          type: boolean
        uri:
          type: string
          description: The URI of the webhook
          format: url
        method:
          type: string
          description: The HTTP request method to use when the webhook is invoked
          enum:
          - GET
          - POST
          - PUT
          - PATCH
        headers:
          type: object
          additionalProperties:
            type: string
            description: Optional request headers to be used when the webhook is invoked
          description: Optional request headers to be used when the webhook is invoked
        triggerEvents:
          type: array
          description: The list of attack events that should cause the webhook to be invoked
          items:
            type: string
            description: The list of attack events that should cause the webhook to be invoked
            enum:
            - INITIALIZING
            - RUNNING
            - FINISHED
        state:
          type: string
          description: State (active/deactivated) of the webhook
          enum:
          - ACTIVE
          - DEACTIVATED
        payload:
          type: string
          description: The payload to be sent when the webhook is invoked
        teamExternalIntegration:
          $ref: '#/components/schemas/TeamExternalIntegrationReference'
        evaluationConfiguration:
          $ref: '#/components/schemas/EvaluationConfiguration'
        type:
          type: string
          description: The type of this webhook
          enum:
          - TASK
          - STATUS_CHECK
          - LOAD_GENERATOR_TRIGGER
          - LOAD_GENERATOR_STATUS_CHECK
          - PREREQUISITE
        multiSelectTags:
          type: object
          additionalProperties:
            type: array
            description: The tags associated with this webhook
            items:
              type: string
              description: The tags associated with this webhook
          description: The tags associated with this webhook
    HasCompareFunctionObject:
      type: object
    ResponseBodyEvaluation:
      required:
      - op
      - predicates
      type: object
      properties:
        op:
          type: string
          description: The operation to logically combine predicates into a success or failure
          enum:
          - AND
          - OR
        predicates:
          type: array
          description: The list of predicates to evaluate against the status check response body
          items:
            $ref: '#/components/schemas/PredicateObject'
      description: The configuration for evaluating the success of a response body
    LoadGeneratorRequest:
      required:
      - name
      type: object
      properties:
        identifier:
          type: string
          description: Optional on create, where one is generated if omitted. On update the identifier in the URL is used
        name:
          type: string
          description: The display name of the load generator
          example: Checkout load test
        active:
          type: boolean
          description: Whether scenario runs will use this load generator. Defaults to false if omitted
        type:
          type: string
          description: The type of load generator. Defaults to WEBHOOK and cannot be changed after creation
          default: WEBHOOK
          enum:
          - WEBHOOK
          - EXTERNAL
        webhookStartLoadTrigger:
          $ref: '#/components/schemas/WebhookRequest'
        webhookStatusCheck:
          $ref: '#/components/schemas/WebhookRequest'
        webhookStopLoadTrigger:
          $ref: '#/components/schemas/WebhookRequest'
        externalTestId:
          type: string
          description: EXTERNAL only, and required for EXTERNAL. The id of the test in the external system
          example: '1234567'
        externalIntegrationType:
          type: string
          description: EXTERNAL only, and required for EXTERNAL. The `type` of an existing load generator team integration, as returned by `GET /external-integrations/load-generator`
        externalIntegrationName:
          type: string
          description: EXTERNAL only, and required for EXTERNAL. The `name` of an existing load generator team integration of type `externalIntegrationType`
          example: My integration
      description: 'Details for creating or updating a load generator on a service. A load generator starts load for a service during a Gremlin scenario run.


        The `type` field selects one of two kinds, and a load generator''s type cannot be changed after it is created. Send only the fields that belong to the chosen type.


        * **WEBHOOK** (default when `type` is omitted): triggers load by calling webhooks. `webhookStartLoadTrigger` is required. `webhookStatusCheck` and `webhookStopLoadTrigger` are optional. Each webhook must use its fixed `name`: `LOAD_GENERATOR_TRIGGER`, `LOAD_GENERATOR_STATUS_CHECK` and `LOAD_GENERATOR_STOP` respectively.

        * **EXTERNAL**: runs a test from an external load testing integration. The team must already have a load generator team integration with the given type and name (see the `/external-integrations/load-generator` endpoints). Requires `externalIntegrationType`, `externalIntegrationName` and `externalTestId`.

        '
    EvaluationConfiguration:
      required:
      - okStatusCodes
      type: object
      properties:
        okLatencyMaxMs:
          type: integer
          description: The maximum latency in milliseconds for a successful status check
          format: int32
        okStatusCodes:
          type: array
          description: The list of successful response status codes for a successful status check
          items:
            type: string
            description: The list of successful response status codes for a successful status check
        responseBodyEvaluation:
          $ref: '#/components/schemas/ResponseBodyEvaluation'
      description: The configuration for evaluating the success/failure of a status check
    TeamExternalIntegrationReference:
      title: StatusCheckRequest.TeamExternalIntegrationReference
      required:
      - name
      type: object
      properties:
        type:
          type: string
          description: The type of the external integration for the health check to be created/updated
          enum:
          - JIRA
          - DATADOG
          - DATADOG_EU
          - DATADOG_US3
          - DATADOG_US5
          - DATADOG_US1_FED
          - PAGERDUTY
          - NEWRELIC
          - GRAFANA
          - DYNATRACE
          - APPDYNAMICS
          - PROMETHEUS
          - CUSTOM
          - K6
          - LOAD_GENERATOR_CUSTOM
          - AWS
          - AZURE
          - GCP
          - BLAZEMETER
        observabilityToolType:
          type: string
          description: The observability tool type of the external integration for the health check to be created/updated
          enum:
          - DATADOG
          - PAGERDUTY
          - NEWRELIC
          - GRAFANA
          - DYNATRACE
          - APPDYNAMICS
          - PROMETHEUS
          - CUSTOM
          - AWS
          - AZURE
        domain:
          type: string
          description: The domain of the observability tool type of the external integration for the health check to be created/updated
        name:
          type: string
          description: The name of the external integration for the health check to be created/updated
      description: Represents the configuration for referencing an external integration
    PredicateObject:
      required:
      - jpQuery
      - rValue
      - type
      type: object
      properties:
        comparator:
          $ref: '#/components/schemas/HasCompareFunctionObject'
        type:
          type: string
          description: The type of primitive this predicate operates on
          enum:
          - String
          - Number
          - Boolean
        jpQuery:
          type: string
          description: The json path query to run to read from the response body
        rValue:
          type: object
          description: The right hand value of the predicate
      description: The list of predicates to evaluate against the status check response body
      discriminator:
        propertyName: type
