naftiko: 1.0.0-alpha2
info:
  label: Gremlin API — datadog
  description: 'Gremlin API — datadog. 2 operations. Lead operation: Search for monitors.. Self-contained Naftiko capability
    covering one Gremlin business surface.'
  tags:
  - Gremlin
  - datadog
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GREMLIN_API_KEY: GREMLIN_API_KEY
capability:
  consumes:
  - type: http
    namespace: gremlin-datadog
    baseUri: https://api.gremlin.com/v1
    description: Gremlin API — datadog business capability. Self-contained, no shared references.
    resources:
    - name: datadog-monitors
      path: /datadog/monitors
      operations:
      - name: searchmonitors
        method: GET
        description: Search for monitors.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: searchString
          in: query
          type: string
        - name: page
          in: query
          type: integer
        - name: perPage
          in: query
          type: integer
        - name: sort
          in: query
          type: string
        - name: datadogIntegrationName
          in: query
          type: string
          required: true
        - name: domain
          in: query
          type: string
        - name: teamId
          in: query
          type: string
          description: Required when using company session token.
          required: true
    - name: datadog-monitors-monitorId
      path: /datadog/monitors/{monitorId}
      operations:
      - name: getmonitor
        method: GET
        description: Get a monitor by id.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: monitorId
          in: path
          type: string
          required: true
        - name: datadogIntegrationName
          in: query
          type: string
          required: true
        - name: domain
          in: query
          type: string
        - name: teamId
          in: query
          type: string
          description: Required when using company session token.
          required: true
  exposes:
  - type: rest
    namespace: gremlin-datadog-rest
    port: 8080
    description: REST adapter for Gremlin API — datadog. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/datadog/monitors
      name: datadog-monitors
      description: REST surface for datadog-monitors.
      operations:
      - method: GET
        name: searchmonitors
        description: Search for monitors.
        call: gremlin-datadog.searchmonitors
        with:
          searchString: rest.searchString
          page: rest.page
          perPage: rest.perPage
          sort: rest.sort
          datadogIntegrationName: rest.datadogIntegrationName
          domain: rest.domain
          teamId: rest.teamId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/datadog/monitors/{monitorid}
      name: datadog-monitors-monitorid
      description: REST surface for datadog-monitors-monitorId.
      operations:
      - method: GET
        name: getmonitor
        description: Get a monitor by id.
        call: gremlin-datadog.getmonitor
        with:
          monitorId: rest.monitorId
          datadogIntegrationName: rest.datadogIntegrationName
          domain: rest.domain
          teamId: rest.teamId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: gremlin-datadog-mcp
    port: 9090
    transport: http
    description: MCP adapter for Gremlin API — datadog. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: search-monitors
      description: Search for monitors.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: gremlin-datadog.searchmonitors
      with:
        searchString: tools.searchString
        page: tools.page
        perPage: tools.perPage
        sort: tools.sort
        datadogIntegrationName: tools.datadogIntegrationName
        domain: tools.domain
        teamId: tools.teamId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-monitor-id
      description: Get a monitor by id.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: gremlin-datadog.getmonitor
      with:
        monitorId: tools.monitorId
        datadogIntegrationName: tools.datadogIntegrationName
        domain: tools.domain
        teamId: tools.teamId
      outputParameters:
      - type: object
        mapping: $.
