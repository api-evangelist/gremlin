naftiko: 1.0.0-alpha2
info:
  label: Gremlin API — executions
  description: 'Gremlin API — executions. 1 operations. Lead operation: Get a list of executions associated with an attack..
    Self-contained Naftiko capability covering one Gremlin business surface.'
  tags:
  - Gremlin
  - executions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GREMLIN_API_KEY: GREMLIN_API_KEY
capability:
  consumes:
  - type: http
    namespace: gremlin-executions
    baseUri: https://api.gremlin.com/v1
    description: Gremlin API — executions business capability. Self-contained, no shared references.
    resources:
    - name: executions
      path: /executions
      operations:
      - name: forattack
        method: GET
        description: Get a list of executions associated with an attack.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: taskId
          in: query
          type: string
        - name: teamId
          in: query
          type: string
          description: Required when using company session token.
          required: true
  exposes:
  - type: rest
    namespace: gremlin-executions-rest
    port: 8080
    description: REST adapter for Gremlin API — executions. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/executions
      name: executions
      description: REST surface for executions.
      operations:
      - method: GET
        name: forattack
        description: Get a list of executions associated with an attack.
        call: gremlin-executions.forattack
        with:
          taskId: rest.taskId
          teamId: rest.teamId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: gremlin-executions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Gremlin API — executions. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-list-executions-associated-attack
      description: Get a list of executions associated with an attack.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: gremlin-executions.forattack
      with:
        taskId: tools.taskId
        teamId: tools.teamId
      outputParameters:
      - type: object
        mapping: $.
