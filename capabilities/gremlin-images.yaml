naftiko: 1.0.0-alpha2
info:
  label: Gremlin API — images
  description: 'Gremlin API — images. 3 operations. Lead operation: retrieve a given image. Self-contained Naftiko capability
    covering one Gremlin business surface.'
  tags:
  - Gremlin
  - images
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GREMLIN_API_KEY: GREMLIN_API_KEY
capability:
  consumes:
  - type: http
    namespace: gremlin-images
    baseUri: https://api.gremlin.com/v1
    description: Gremlin API — images business capability. Self-contained, no shared references.
    resources:
    - name: images-imageName
      path: /images/{imageName}
      operations:
      - name: get5
        method: GET
        description: retrieve a given image
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: imageName
          in: path
          type: string
          required: true
        - name: teamId
          in: query
          type: string
          description: Required when using company session token.
          required: true
      - name: delete2
        method: DELETE
        description: delete a given image
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: imageName
          in: path
          type: string
          required: true
        - name: teamId
          in: query
          type: string
          description: Required when using company session token.
          required: true
    - name: images-parentId-imageName
      path: /images/{parentId}/{imageName}
      operations:
      - name: getwithparent
        method: GET
        description: Retrieve a given image for an associated Scenario or Gameday
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: imageName
          in: path
          type: string
          required: true
        - name: parentId
          in: path
          type: string
          required: true
        - name: teamId
          in: query
          type: string
          description: Required when using company session token.
          required: true
  exposes:
  - type: rest
    namespace: gremlin-images-rest
    port: 8080
    description: REST adapter for Gremlin API — images. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/images/{imagename}
      name: images-imagename
      description: REST surface for images-imageName.
      operations:
      - method: GET
        name: get5
        description: retrieve a given image
        call: gremlin-images.get5
        with:
          imageName: rest.imageName
          teamId: rest.teamId
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete2
        description: delete a given image
        call: gremlin-images.delete2
        with:
          imageName: rest.imageName
          teamId: rest.teamId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/images/{parentid}/{imagename}
      name: images-parentid-imagename
      description: REST surface for images-parentId-imageName.
      operations:
      - method: GET
        name: getwithparent
        description: Retrieve a given image for an associated Scenario or Gameday
        call: gremlin-images.getwithparent
        with:
          imageName: rest.imageName
          parentId: rest.parentId
          teamId: rest.teamId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: gremlin-images-mcp
    port: 9090
    transport: http
    description: MCP adapter for Gremlin API — images. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: retrieve-given-image
      description: retrieve a given image
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: gremlin-images.get5
      with:
        imageName: tools.imageName
        teamId: tools.teamId
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-given-image
      description: delete a given image
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: gremlin-images.delete2
      with:
        imageName: tools.imageName
        teamId: tools.teamId
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-given-image-associated-scenario
      description: Retrieve a given image for an associated Scenario or Gameday
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: gremlin-images.getwithparent
      with:
        imageName: tools.imageName
        parentId: tools.parentId
        teamId: tools.teamId
      outputParameters:
      - type: object
        mapping: $.
