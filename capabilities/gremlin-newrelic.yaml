naftiko: 1.0.0-alpha2
info:
  label: Gremlin API — newrelic
  description: 'Gremlin API — newrelic. 1 operations. Lead operation: Get an incident by id.. Self-contained Naftiko capability
    covering one Gremlin business surface.'
  tags:
  - Gremlin
  - newrelic
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GREMLIN_API_KEY: GREMLIN_API_KEY
capability:
  consumes:
  - type: http
    namespace: gremlin-newrelic
    baseUri: https://api.gremlin.com/v1
    description: Gremlin API — newrelic business capability. Self-contained, no shared references.
    resources:
    - name: newrelic-incidents-incidentId
      path: /newrelic/incidents/{incidentId}
      operations:
      - name: incident
        method: GET
        description: Get an incident by id.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: query
          type: string
        - name: incidentId
          in: path
          type: string
          required: true
        - name: teamId
          in: query
          type: string
          description: Required when using company session token.
          required: true
  exposes:
  - type: rest
    namespace: gremlin-newrelic-rest
    port: 8080
    description: REST adapter for Gremlin API — newrelic. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/newrelic/incidents/{incidentid}
      name: newrelic-incidents-incidentid
      description: REST surface for newrelic-incidents-incidentId.
      operations:
      - method: GET
        name: incident
        description: Get an incident by id.
        call: gremlin-newrelic.incident
        with:
          name: rest.name
          incidentId: rest.incidentId
          teamId: rest.teamId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: gremlin-newrelic-mcp
    port: 9090
    transport: http
    description: MCP adapter for Gremlin API — newrelic. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-incident-id
      description: Get an incident by id.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: gremlin-newrelic.incident
      with:
        name: tools.name
        incidentId: tools.incidentId
        teamId: tools.teamId
      outputParameters:
      - type: object
        mapping: $.
