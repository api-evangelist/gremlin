naftiko: 1.0.0-alpha2
info:
  label: Gremlin API — metadata
  description: 'Gremlin API — metadata. 1 operations. Lead operation: Get metadata about the Gremlin commands.. Self-contained
    Naftiko capability covering one Gremlin business surface.'
  tags:
  - Gremlin
  - metadata
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GREMLIN_API_KEY: GREMLIN_API_KEY
capability:
  consumes:
  - type: http
    namespace: gremlin-metadata
    baseUri: https://api.gremlin.com/v1
    description: Gremlin API — metadata business capability. Self-contained, no shared references.
    resources:
    - name: metadata
      path: /metadata
      operations:
      - name: metadata
        method: GET
        description: Get metadata about the Gremlin commands.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: teamId
          in: query
          type: string
          description: Required when using company session token.
          required: true
  exposes:
  - type: rest
    namespace: gremlin-metadata-rest
    port: 8080
    description: REST adapter for Gremlin API — metadata. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/metadata
      name: metadata
      description: REST surface for metadata.
      operations:
      - method: GET
        name: metadata
        description: Get metadata about the Gremlin commands.
        call: gremlin-metadata.metadata
        with:
          teamId: rest.teamId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: gremlin-metadata-mcp
    port: 9090
    transport: http
    description: MCP adapter for Gremlin API — metadata. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-metadata-about-gremlin-commands
      description: Get metadata about the Gremlin commands.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: gremlin-metadata.metadata
      with:
        teamId: tools.teamId
      outputParameters:
      - type: object
        mapping: $.
