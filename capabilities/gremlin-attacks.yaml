  - type: http
    namespace: gremlin-attacks
    baseUri: https://api.gremlin.com/v1
    description: Gremlin API — attacks business capability. Self-contained, no shared references.
    resources:
    - name: attacks
      path: /attacks
      operations:
      - name: all
        method: GET
        description: List all attacks.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: source
          in: query
          type: string
          description: Filter attacks to either adhoc or scenario.
        - name: pageSize
          in: query
          type: integer
          description: This value determines how many results will be returned per call.
        - name: teamId
          in: query
          type: string
          description: Required when using company session token.
          required: true
      - name: createnewattack
        method: POST
        description: Create a new attack.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: teamId
          in: query
          type: string
          description: Required when using company session token.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: halt
        method: DELETE
        description: Idempotently halt all active attacks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
