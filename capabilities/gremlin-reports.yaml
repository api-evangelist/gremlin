naftiko: 1.0.0-alpha2
info:
  label: Gremlin API — reports
  description: 'Gremlin API — reports. 21 operations. Lead operation: Loads the Attacks Summary for the specified time period..
    Self-contained Naftiko capability covering one Gremlin business surface.'
  tags:
  - Gremlin
  - reports
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GREMLIN_API_KEY: GREMLIN_API_KEY
capability:
  consumes:
  - type: http
    namespace: gremlin-reports
    baseUri: https://api.gremlin.com/v1
    description: Gremlin API — reports business capability. Self-contained, no shared references.
    resources:
    - name: reports-attacks
      path: /reports/attacks
      operations:
      - name: attacksummary
        method: GET
        description: Loads the Attacks Summary for the specified time period.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: teamId
          in: query
          type: string
          description: team identifier associated with the requester's team
          required: true
        - name: start
          in: query
          type: string
          required: true
        - name: end
          in: query
          type: string
          required: true
        - name: period
          in: query
          type: string
          required: true
    - name: reports-clients
      path: /reports/clients
      operations:
      - name: clientsummary
        method: GET
        description: Loads the Client Summary for the specified time period.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: teamId
          in: query
          type: string
          description: team identifier associated with the requester's team
          required: true
        - name: start
          in: query
          type: string
          required: true
        - name: end
          in: query
          type: string
          required: true
        - name: period
          in: query
          type: string
          required: true
    - name: reports-companies
      path: /reports/companies
      operations:
      - name: companysummary
        method: GET
        description: Loads the Company Summary for the specified month.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: startDate
          in: query
          type: string
          required: true
        - name: endDate
          in: query
          type: string
          required: true
    - name: reports-companies-pdf
      path: /reports/companies/pdf
      operations:
      - name: companysummarypdf
        method: GET
        description: Loads the Company Summary PDF for the specified time frame.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: startDate
          in: query
          type: string
        - name: endDate
          in: query
          type: string
        - name: numberOfDataPoints
          in: query
          type: integer
        - name: topN
          in: query
          type: integer
        - name: filter
          in: query
          type: string
        - name: groupBy
          in: query
          type: string
    - name: reports-companies-reliability-management
      path: /reports/companies/reliability-management
      operations:
      - name: getcompanyreliabilitymanagementreport
        method: GET
        description: Loads the Company Reliability Management Report for the specified time window defaulting to a week.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: startDate
          in: query
          type: string
        - name: endDate
          in: query
          type: string
        - name: topN
          in: query
          type: integer
        - name: includeDailyReport
          in: query
          type: boolean
    - name: reports-companies-reliability-management-grouped
      path: /reports/companies/reliability-management/grouped
      operations:
      - name: getcompanyreliabilitymanagementreportgrouped
        method: GET
        description: Loads the Company Reliability Management Report grouped by query param value of groupBy - defaults to
          TEAM.
        outputRawFormat: json
        outputParameters:
