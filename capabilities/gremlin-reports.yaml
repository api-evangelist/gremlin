      - name: getcompanyreliabilitymanagementreport1
        method: GET
        description: Loads the company service list and reliability trend for each service for the specified time window defaulting
          to a month.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: startDate
          in: query
          type: string
        - name: endDate
          in: query
          type: string
        - name: numberOfDataPoints
          in: query
          type: integer
        - name: topN
          in: query
          type: integer
        - name: filter
          in: query
          type: string
    - name: reports-companies-trends
      path: /reports/companies/trends
      operations:
      - name: getcompanyscorerisktrends
        method: GET
        description: Returns the Risk and Score trends for your company across all associated services
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
