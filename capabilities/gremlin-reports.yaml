        name: attacksummary
        description: Loads the Attacks Summary for the specified time period.
        call: gremlin-reports.attacksummary
        with:
          teamId: rest.teamId
          start: rest.start
          end: rest.end
          period: rest.period
        outputParameters:
        - type: object
          mapping: $.
