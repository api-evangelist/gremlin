      - name: pricingreport
        method: GET
        description: Loads the pricing usage for the specified dates and tracking period.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: startDate
          in: query
          type: string
          description: Start date (yyyy-mm-dd) for the pricing usage. Should be within the current contract duration
          required: true
        - name: endDate
          in: query
          type: string
          description: End date (yyyy-mm-dd) for the pricing usage. Should be within the current contract duration
          required: true
        - name: trackingPeriod
          in: query
          type: string
          description: Tracking period for the pricing usage. Should be either Daily, Weekly or Monthly based on the contract.
            Defaults to the currently configured period for the comp
    - name: reports-services-reliability-management-reliability-report-trend
      path: /reports/services/reliability-management/reliability-report-trend
      operations:
      - name: getreliabilityreporttrendforallservicesofteam
        method: GET
        description: Loads the Reliability report trend for all the services of the team for the specified time period defaulting
